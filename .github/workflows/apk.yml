name: Build APK
on:
  push:
    branches: [main]
    paths-ignore: ['README.md']
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: apk, cancel-in-progress: true }
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - name: Build APK
        run: bash android/build.sh
      - name: Publish to the "latest-apk" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest-apk -y --cleanup-tag || true
          gh release create latest-apk android/out/tower-patrol.apk \
            --title "ટાવર પેટ્રોલ APK (build ${{ github.run_number }})" \
            --notes "ફોનમાં tower-patrol.apk ડાઉનલોડ કરી ખોલો અને Install દબાવો." --latest
